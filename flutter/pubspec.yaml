name: horizon_launcher
description: "CRAFTIX - Minecraft Java Launcher for Android (Flutter/Dart front end)."
publish_to: 'none'
version: 0.7.9+31

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/hero.png
    - assets/download_scene.png
