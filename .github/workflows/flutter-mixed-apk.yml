# CRAFTIX 0.7.8: one signed APK containing Flutter (Dart/Kotlin) AND the real
# Rust engine. The Rust payload is extracted from the already verified, signed
# `craftix-0.7.8` Rust release built from this exact source tree.
name: CRAFTIX Flutter + Rust mixed release APK
on:
  push:
    branches: [arena/92db30ff-horizon]
    paths:
      - '.github/workflows/flutter-mixed-apk.yml'
      - 'tools/prepare_mixed_flutter.py'
      - 'tools/verify_mixed_apk.py'
      - 'tools/verify_craftix_release.py'
      - 'tools/ci_craftix_signing.sh'
      - 'tools/ci_record_certificate.py'
      - 'tools/check_jni_symbols.py'
      - 'tools/test_live_catalog_api.py'
      - 'flutter/**'
      - 'crates/horizon-client/src/android/flutter_bridge.rs'
      - 'crates/horizon-client/src/android/bridge_rules.rs'
      - 'crates/horizon-client/src/android_main.rs'
      - 'crates/horizon-client/src/android/launcher.rs'
      - 'ci-flutter-apk.trigger'
      # Negation inside `paths`: doc-only pushes must not rebuild an 86 MB APK.
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: craftix-flutter-mixed-apk
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Permanent CRAFTIX release key, supplied by the repository owner.
  CRAFTIX_KEYSTORE_BASE64: ${{ secrets.CRAFTIX_KEYSTORE_BASE64 }}
  CRAFTIX_STORE_PASSWORD: ${{ secrets.CRAFTIX_STORE_PASSWORD }}
  CRAFTIX_KEY_ALIAS: ${{ secrets.CRAFTIX_KEY_ALIAS }}
  CRAFTIX_KEY_PASSWORD: ${{ secrets.CRAFTIX_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pin the Android SDK
        run: bash tools/ci_android_setup.sh 2>&1 | tee /tmp/mixed-setup.txt

      - name: Decode the permanent CRAFTIX release keystore
        shell: bash
        run: bash tools/ci_craftix_signing.sh 2>&1 | tee /tmp/mixed-signing.txt

      - name: Source and contract checks
        run: |
          set -o pipefail
          {
            flutter --version
            python3 tools/verify_flutter_foundation.py
            python3 tools/verify_flutter_native_bridge.py --write-evidence
            python3 tools/verify_craftix_release.py --report .local/CRAFTIX_RELEASE_CHECK.json
            rustc --test crates/horizon-client/src/android/bridge_rules.rs -o /tmp/bridge_rules_test
            /tmp/bridge_rules_test
            python3 tools/verify_action_matrix.py --write
            python3 -m unittest discover -s tests -p 'test_android*.py'
            git diff --check
          } 2>&1 | tee /tmp/mixed-contracts.txt

      - name: Flutter analyze and test
        working-directory: flutter
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/mixed-pubget.txt
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/mixed-analyze.txt
          flutter test --reporter expanded 2>&1 | tee /tmp/mixed-test.txt

      - name: Extract the real Rust payload from the verified CRAFTIX release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/android/gradle-jni/arm64-v8a .local/android/gradle-assets
          for i in $(seq 1 70); do
            if gh release view craftix-0.7.8 --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -q 'CRAFTIX-Rust-0.7.8-arm64-v8a.apk'; then
              echo "CRAFTIX Rust 0.7.8 release is ready"; break
            fi
            echo "waiting for CRAFTIX Rust 0.7.8 release ($i/70)"; sleep 30
          done
          gh release view craftix-0.7.8 --json assets --jq '.assets[].name' \
            | grep -q 'CRAFTIX-Rust-0.7.8-arm64-v8a.apk'
          gh release download craftix-0.7.8 \
            --pattern 'CRAFTIX-Rust-0.7.8-arm64-v8a.apk' \
            --dir /tmp/rust-apk --clobber
          python3 - <<'PY'
          import zipfile, pathlib
          apk = next(pathlib.Path('/tmp/rust-apk').glob('*.apk'))
          root = pathlib.Path('/home/runner/work/Horizon/Horizon')
          with zipfile.ZipFile(apk) as z:
              so = next(n for n in z.namelist() if n.endswith('libhorizon_android.so'))
              engine = next(n for n in z.namelist() if n.endswith('engine-data.zip'))
              (root / '.local/android/gradle-jni/arm64-v8a/libhorizon_android.so').write_bytes(z.read(so))
              (root / '.local/android/gradle-assets/engine-data.zip').write_bytes(z.read(engine))
              print('rust .so:', so, len(z.read(so)))
              print('engine data:', engine, len(z.read(engine)))
          PY
          sha256sum .local/android/gradle-jni/arm64-v8a/libhorizon_android.so \
                    .local/android/gradle-assets/engine-data.zip
          python3 tools/check_jni_symbols.py \
            .local/android/gradle-jni/arm64-v8a/libhorizon_android.so
          # Prove the binary carries the real C ABI bridge, including the
          # new installer entry point.
          grep -a -c 'Java_dev_horizon_android_HorizonEngine_nativeInstallStart' \
            .local/android/gradle-jni/arm64-v8a/libhorizon_android.so

      - name: Generate Flutter Android scaffolding and stage the Rust payload
        run: python3 tools/prepare_mixed_flutter.py 2>&1 | tee /tmp/mixed-stage.txt

      - name: Build the mixed release APK
        working-directory: flutter
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/mixed-build.txt
          ls -lh build/app/outputs/flutter-apk/

      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "🤖 CRAFTIX mixed APK build diagnostics $GITHUB_RUN_ID" > /tmp/mixed-build-tail.md
          echo '```' >> /tmp/mixed-build-tail.md
          tail -c 35000 /tmp/mixed-build.txt >> /tmp/mixed-build-tail.md 2>/dev/null || echo 'no build log' >> /tmp/mixed-build-tail.md
          echo '```' >> /tmp/mixed-build-tail.md
          gh issue comment 1 --body-file /tmp/mixed-build-tail.md

      - name: Verify the mixed APK (manifest, libraries, signature)
        run: |
          set -euo pipefail
          OUT=.local/android/releases/mixed-0.7.8
          mkdir -p "$OUT"
          APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAVA="$JAVA_HOME/bin/java"
          # v1 (JAR) + v2 with the SAME permanent CRAFTIX key: some OEM
          # installers reject v2-only APKs as "package appears to be invalid".
          bash tools/resign_craftix_apk.sh "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            > "$OUT/MIXED_manifest-tree.txt" || true
          grep -n -E 'screenOrientation|:engine|lib_name' "$OUT/MIXED_manifest-tree.txt" || true
          "$BT/aapt2" dump badging "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            > "$OUT/MIXED_badging.txt"
          "$JAVA" -jar "$BT/lib/apksigner.jar" verify --verbose "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            > "$OUT/MIXED_signature.txt"
          "$JAVA" -jar "$BT/lib/apksigner.jar" verify --print-certs "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            > "$OUT/MIXED_certificate.txt"
          python3 tools/ci_record_certificate.py "$OUT/MIXED_certificate.txt" \
            "$OUT/MIXED_CERT_FINGERPRINT.json"
          python3 tools/verify_mixed_apk.py "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            --aapt2 "$BT/aapt2" --apksigner "$JAVA_HOME/bin/java -jar $BT/lib/apksigner.jar" \
            --report "$OUT/MIXED_APK_VERIFICATION.json"
          python3 tools/diagnose_apk_install.py "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" \
            --aapt2 "$BT/aapt2" --apksigner "$JAVA -jar $BT/lib/apksigner.jar" \
            --report "$OUT/MIXED_INSTALL_DIAGNOSTICS.json"
          ( cd "$OUT" && sha256sum CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk > SHA256SUMS_FLUTTER.txt )
          printf 'BUILD_COMMIT=%s\nSOURCE=craftix-0.7.8 Rust APK + Flutter build\n' "$GITHUB_SHA" \
            > "$OUT/BUILD_INFO.txt"
          cat "$OUT/MIXED_APK_VERIFICATION.json"
          cat "$OUT/MIXED_CERT_FINGERPRINT.json"

      - name: Publish verification diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=.local/android/releases/mixed-0.7.8
          {
            echo "🤖 CRAFTIX mixed APK verification diagnostics $GITHUB_RUN_ID"
            echo '### packaged entries'
            echo '```'
            unzip -l "$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" 2>/dev/null \
              | grep -E 'lib/|engine-data|flutter_assets' | head -40
            echo '```'
            echo '### verification report'
            echo '```'
            cat "$OUT/MIXED_APK_VERIFICATION.json" 2>/dev/null || echo 'no report produced'
            echo '```'
            echo '### public certificate fingerprint'
            echo '```'
            cat "$OUT/MIXED_CERT_FINGERPRINT.json" 2>/dev/null || echo 'no fingerprint report'
            echo '```'
          } > /tmp/verify-diag.md
          gh issue comment 1 --body-file /tmp/verify-diag.md

      - name: Publish the mixed APK as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=craftix-0.7.8
          OUT=.local/android/releases/mixed-0.7.8
          # Both APKs use the SAME CRAFTIX key. Publish one CI-generated public
          # fingerprint report under the Rust asset name too (clobbers the
          # earlier report that used a colon-only regex).
          cp "$OUT/MIXED_CERT_FINGERPRINT.json" "$OUT/CERT_FINGERPRINT.json"
          ASSETS=("$OUT/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk" "$OUT/SHA256SUMS_FLUTTER.txt" \
                  "$OUT/MIXED_APK_VERIFICATION.json" "$OUT/MIXED_badging.txt" \
                  "$OUT/MIXED_manifest-tree.txt" "$OUT/MIXED_signature.txt" \
                  "$OUT/MIXED_certificate.txt" "$OUT/MIXED_CERT_FINGERPRINT.json" \
                  "$OUT/CERT_FINGERPRINT.json" "$OUT/MIXED_INSTALL_DIAGNOSTICS.json" \
                  "$OUT/BUILD_INFO.txt")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title 'CRAFTIX 0.7.8 – Flutter + Rust' \
              --notes-file tools/ci-craftix-078-notes.md --target "$GITHUB_SHA" "${ASSETS[@]}"
          fi
          gh release view "$TAG" --json url,tagName,assets --jq '.url, (.assets[].name)'

      - name: Upload the mixed APK as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a
          path: .local/android/releases/mixed-0.7.8/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk

      - name: Remove temporary CRAFTIX keystore
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$RUNNER_TEMP/craftix-release.jks"
          echo "temporary CRAFTIX keystore removed from the runner"

      - name: Report results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          touch /tmp/mixed-contracts.txt /tmp/mixed-analyze.txt /tmp/mixed-test.txt /tmp/mixed-build.txt /tmp/mixed-stage.txt
          {
            echo "🤖 CRAFTIX mixed APK run $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo '### contracts'; echo '```'; tail -n 40 /tmp/mixed-contracts.txt; echo '```'
            echo '### analyze'; echo '```'; tail -n 40 /tmp/mixed-analyze.txt; echo '```'
            echo '### test'; echo '```'; tail -n 30 /tmp/mixed-test.txt; echo '```'
            echo '### staging'; echo '```'; tail -n 40 /tmp/mixed-stage.txt; echo '```'
            echo '### build'; echo '```'; tail -n 80 /tmp/mixed-build.txt; echo '```'
          } > /tmp/mixed-report.md
          head -c 60000 /tmp/mixed-report.md > /tmp/mixed-report-trim.md
          gh issue comment 1 --body-file /tmp/mixed-report-trim.md
