# Manual candidate build: never overwrite the published 0.7.8 release.
# The Rust library and Flutter UI are built from this exact commit.
name: CRAFTIX Flutter + Rust mixed release APK
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CRAFTIX_KEYSTORE_BASE64: ${{ secrets.CRAFTIX_KEYSTORE_BASE64 }}
  CRAFTIX_STORE_PASSWORD: ${{ secrets.CRAFTIX_STORE_PASSWORD }}
  CRAFTIX_KEY_ALIAS: ${{ secrets.CRAFTIX_KEY_ALIAS }}
  CRAFTIX_KEY_PASSWORD: ${{ secrets.CRAFTIX_KEY_PASSWORD }}
  CARGO_TARGET_DIR: ${{ github.workspace }}/.local/android/release-arm64
  CARGO_BUILD_JOBS: '2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/android/release-arm64
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Check Flutter UI
        working-directory: flutter
        run: |
          set -euo pipefail
          show_failure() {
            grep -E -A 10 "EXCEPTION|Expected:|Actual:|\[E\]|Error:|Some tests failed" /tmp/flutter-ui.log > /tmp/flutter-errors || cp /tmp/flutter-ui.log /tmp/flutter-errors
            printf "::error::"
            tail -c 2200 /tmp/flutter-errors | base64 -w0
            echo
          }
          trap show_failure ERR
          flutter pub get 2>&1 | tee /tmp/flutter-ui.log
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter-ui.log
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-ui.log
      - name: Set up Android and decode existing release key
        run: |
          set -euo pipefail
          bash tools/ci_android_setup.sh
          rustup target add aarch64-linux-android
          bash tools/ci_craftix_signing.sh
      - name: Build native engine from this commit
        run: |
          set -euo pipefail
          exec > >(tee /tmp/native-build.log) 2>&1
          trap 'printf "::error::"; tail -c 2200 /tmp/native-build.log | base64 -w0; echo' ERR
          python3 tools/android_build.py --abi arm64-v8a --public --profile release --rust-only --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
          mkdir -p .local/android/gradle-jni/arm64-v8a .local/android/gradle-assets
          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/libhorizon_android.so" .local/android/gradle-jni/arm64-v8a/
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | head -1)
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded .local/android/gradle-jni/arm64-v8a/libhorizon_android.so
          python3 tools/check_jni_symbols.py .local/android/gradle-jni/arm64-v8a/libhorizon_android.so
      - name: Obtain existing engine data and comparison certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous
          gh release download craftix-0.7.8 --pattern 'CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk' --dir /tmp/previous
          OLD=/tmp/previous/CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk
          "$JAVA_HOME/bin/java" -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs "$OLD" > /tmp/previous-certificate.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = next(Path('/tmp/previous').glob('*.apk'))
          with ZipFile(apk) as archive:
              matches = [n for n in archive.namelist() if n.endswith('engine-data.zip')]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one engine data file: {matches}')
              Path('.local/android/gradle-assets/engine-data.zip').write_bytes(archive.read(matches[0]))
          PY
      - name: Build signed Flutter APK
        run: |
          set -euo pipefail
          python3 tools/prepare_mixed_flutter.py
          cd flutter
          flutter build apk --release --target-platform android-arm64
      - name: Verify package and same signing certificate as previous release
        run: |
          set -euo pipefail
          mkdir -p .local/android/releases/candidate
          APK=.local/android/releases/candidate/CRAFTIX-0.7.9-arm64-v8a.apk
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "$APK"
          bash tools/resign_craftix_apk.sh "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SIGNER="$JAVA_HOME/bin/java -jar $BT/lib/apksigner.jar"
          $SIGNER verify --verbose --print-certs "$APK" > .local/android/releases/candidate/certificate.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          def fingerprint(path):
              data = Path(path).read_text()
              found = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})', data)
              if not found:
                  raise SystemExit(f'No signer certificate fingerprint in {path}')
              return found.group(1).lower()
          old = fingerprint('/tmp/previous-certificate.txt')
          new = fingerprint('.local/android/releases/candidate/certificate.txt')
          if old != new:
              raise SystemExit('Signing certificate differs from the published CRAFTIX 0.7.8 APK; refusing publication')
          print('Certificate matches the published CRAFTIX 0.7.8 APK:', new)
          PY
          python3 tools/verify_mixed_apk.py "$APK" --aapt2 "$BT/aapt2" --apksigner "$SIGNER" --report .local/android/releases/candidate/verification.json
          python3 tools/diagnose_apk_install.py "$APK" --aapt2 "$BT/aapt2" --apksigner "$SIGNER" --report .local/android/releases/candidate/install-diagnostics.json
          (cd .local/android/releases/candidate && sha256sum CRAFTIX-0.7.9-arm64-v8a.apk > SHA256SUMS.txt)
          echo "BUILD_COMMIT=$GITHUB_SHA" > .local/android/releases/candidate/BUILD_INFO.txt
      - name: Publish candidate (not device-validated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=craftix-0.7.9-beta
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Candidate tag already exists; refusing to replace an existing release.' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'CRAFTIX 0.7.9 beta' \
            --notes 'Candidate build: new download card and landscape game Activity. Signed with the existing CRAFTIX certificate. Real Android-device validation is still required.' \
            .local/android/releases/candidate/CRAFTIX-0.7.9-arm64-v8a.apk \
            .local/android/releases/candidate/SHA256SUMS.txt \
            .local/android/releases/candidate/verification.json \
            .local/android/releases/candidate/install-diagnostics.json \
            .local/android/releases/candidate/certificate.txt \
            .local/android/releases/candidate/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CRAFTIX-0.7.9-arm64-v8a
          path: .local/android/releases/candidate/
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/craftix-release.jks"
