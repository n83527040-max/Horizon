# Gates phases 3-4 of the Flutter migration. The sandbox has no Dart/Flutter
# SDK and no device, so GitHub Actions is the only real analyzer/test runner.
name: Flutter foundation checks
on:
  push:
    branches: [arena/92db30ff-horizon]
    paths:
      - 'flutter/**'
      - 'tools/verify_flutter_foundation.py'
      - 'tools/verify_flutter_migration_audit.py'
      - 'FLUTTER_MIGRATION_AUDIT.md'
      - 'crates/horizon-client/src/android/launcher_pages.rs'
      - 'research-lock.json'
      - 'packaging/android/build.gradle'
      - '.github/workflows/flutter-foundation.yml'
      - 'ci-flutter.trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: horizon-flutter-foundation
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version 2>&1 | tee /tmp/flutter-version.txt
          dart --version 2>&1 | tee -a /tmp/flutter-version.txt
          python3 --version

      - name: Cross-language contract + audit + existing Android tests
        run: |
          {
            echo "\$ python3 tools/verify_flutter_migration_audit.py"
            python3 tools/verify_flutter_migration_audit.py
            echo "\$ python3 tools/verify_flutter_foundation.py"
            python3 tools/verify_flutter_foundation.py
            echo "\$ python3 -m unittest discover -s tests -p 'test_android*.py'"
            python3 -m unittest discover -s tests -p 'test_android*.py'
          } 2>&1 | tee /tmp/contract.txt

      - name: Pub get
        if: always()
        working-directory: flutter
        run: flutter pub get 2>&1 | tee /tmp/flutter-pubget.txt

      - name: Flutter analyze
        if: always()
        working-directory: flutter
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter-analyze.txt

      - name: Flutter test
        if: always()
        working-directory: flutter
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test.txt

      # The results-receiver host is not reachable from the coding sandbox, so
      # mirror every step's output into an issue comment (api.github.com only).
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          touch /tmp/contract.txt /tmp/flutter-pubget.txt /tmp/flutter-analyze.txt /tmp/flutter-test.txt /tmp/flutter-version.txt
          {
            echo "🤖 Agent: Flutter foundation run $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo
            echo "### Toolchain"
            echo '```'; cat /tmp/flutter-version.txt; echo '```'
            echo "### Contracts / existing tests"
            echo '```'; tail -n 60 /tmp/contract.txt; echo '```'
            echo "### flutter pub get"
            echo '```'; tail -n 30 /tmp/flutter-pubget.txt; echo '```'
            echo "### flutter analyze"
            echo '```'; tail -n 120 /tmp/flutter-analyze.txt; echo '```'
            echo "### flutter test"
            echo '```'; tail -n 900 /tmp/flutter-test.txt; echo '```'
          } > /tmp/flutter-report.md
          head -c 60000 /tmp/flutter-report.md > /tmp/flutter-report-trim.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments" -F body=@/tmp/flutter-report-trim.md
          echo "report exit: $?"
