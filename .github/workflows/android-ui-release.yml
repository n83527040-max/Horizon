# Optional release pipeline for the 0.7.6 UI redesign. Dispatch-only: the
# upstream fork keeps `android-source.yml` as its only always-on workflow.
name: Android UI redesign checks and release
on:
  workflow_dispatch:
    inputs:
      native_checks:
        description: Type-check the Android Rust targets (no APK)
        type: boolean
        default: true
      build_apk:
        description: Build public release APKs (needs Mojang table preparation)
        type: boolean
        default: false
      game_test:
        description: Boot an x86_64 emulator and drive a real game session
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # With both switches off this dispatch is reserved for control-only checks.
  source:
    if: ${{ inputs.native_checks || inputs.build_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git diff --check
      - run: python3 tools/check_public_tree.py --history
      - run: python3 -m unittest discover -s tests -p 'test_android*.py'
      - run: python3 tools/android_ui_layout.py
      - run: python3 tools/android_ui_preview.py
      - name: Check the exported workflow contract still matches
        run: cmp .github/workflows/android-source.yml packaging/android/source-checks.yml

  native:
    if: ${{ inputs.native_checks }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    env:
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: "2"
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          bash tools/ci_android_setup.sh
          rustup target add "${{ matrix.target }}"
      - name: Type-check and lint the redesigned launcher
        shell: bash
        run: |
          set -o pipefail
          trap 'printf "::error::"; tail -c 2200 /tmp/native-check.log | base64 -w0; echo' ERR
          python3 tools/android_build.py --abi "${{ matrix.abi }}" --clippy --public \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" 2>&1 | tee /tmp/native-check.log

  apk:
    if: ${{ inputs.build_apk }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: .local/release-target
      CARGO_BUILD_JOBS: "2"
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Android toolchain and Gradle 8.14
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          rustup target add aarch64-linux-android
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14-all.zip
          mkdir -p "$HOME/.gradle/wrapper/dists/gradle-8.14-all/ci"
          unzip -q /tmp/gradle.zip -d "$HOME/.gradle/wrapper/dists/gradle-8.14-all/ci"
      - name: Prepare pinned engine tables (private, never committed)
        run: python3 tools/android_prepare.py
      - name: Build release APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash tools/build_release_apk.sh
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-0.7.6-redesign
          path: .local/android/releases/0.7.6/*.apk
          if-no-files-found: error

  # Control-only verification runs independently; it never builds or publishes APKs.
  controls-desktop-tests:
    if: ${{ !inputs.native_checks && !inputs.build_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test touch input, editor and layout
        shell: bash
        run: |
          set -o pipefail
          trap 'printf "::error::"; tail -c 4000 /tmp/check.log | base64 -w0; echo' ERR
          cargo test -p horizon-client-render --lib touch:: -- --nocapture 2>&1 | tee /tmp/check.log
          cargo test -p horizon-client-render --lib craftix_controls:: -- --nocapture 2>&1 | tee /tmp/check.log
          cargo test -p horizon-client-input --lib keymapping:: -- --nocapture 2>&1 | tee /tmp/check.log
          rustup target add wasm32-unknown-unknown
          cargo test -p horizon-mods --features runtime,pack --test sandbox craftix_touch_key_events_reach_real_mod_runtime -- --nocapture 2>&1 | tee /tmp/check.log
  controls-android-check:
    if: ${{ !inputs.native_checks && !inputs.build_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          bash tools/ci_android_setup.sh
          rustup target add aarch64-linux-android
      - name: Check Android host without packaging
        shell: bash
        run: |
          set -o pipefail
          trap 'printf "::error::"; tail -c 4000 /tmp/check.log | base64 -w0; echo' ERR
          python3 tools/android_build.py --abi arm64-v8a --check --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" 2>&1 | tee /tmp/check.log

  # Real Android game session: builds a non-public x86_64 test APK, boots an
  # emulator and drives HorizonActivity (HUD touch, editor save, focus, restart).
  build-test-apk:
    if: ${{ inputs.game_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CRAFTIX_KEYSTORE_BASE64: ${{ secrets.CRAFTIX_KEYSTORE_BASE64 }}
      CRAFTIX_STORE_PASSWORD: ${{ secrets.CRAFTIX_STORE_PASSWORD }}
      CRAFTIX_KEY_ALIAS: ${{ secrets.CRAFTIX_KEY_ALIAS }}
      CRAFTIX_KEY_PASSWORD: ${{ secrets.CRAFTIX_KEY_PASSWORD }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/test-target
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/test-target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          bash tools/ci_android_setup.sh
          rustup target add x86_64-linux-android
      - name: Decode the existing CRAFTIX release key
        run: bash tools/ci_craftix_signing.sh
      - name: Build the non-public Rust engine for x86_64
        run: |
          set -euo pipefail
          exec > >(tee /tmp/native-build.log) 2>&1
          trap 'printf "::error::"; tail -c 2200 /tmp/native-build.log | base64 -w0; echo' ERR
          python3 tools/android_build.py --abi x86_64 --profile release --rust-only \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
          mkdir -p .local/android/gradle-jni/x86_64
          cp "$CARGO_TARGET_DIR/x86_64-linux-android/release/libhorizon_android.so" \
            .local/android/gradle-jni/x86_64/
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | head -1)
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
            .local/android/gradle-jni/x86_64/libhorizon_android.so
          python3 tools/check_jni_symbols.py .local/android/gradle-jni/x86_64/libhorizon_android.so
      - name: Obtain engine data from the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous
          gh release download craftix-0.7.8 --pattern 'CRAFTIX-Flutter-Rust-0.7.8-arm64-v8a.apk' --dir /tmp/previous
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = next(Path('/tmp/previous').glob('*.apk'))
          with ZipFile(apk) as archive:
              matches = [n for n in archive.namelist() if n.endswith('engine-data.zip')]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one engine data file: {matches}')
              Path('.local/android/gradle-assets/engine-data.zip').parent.mkdir(parents=True, exist_ok=True)
              Path('.local/android/gradle-assets/engine-data.zip').write_bytes(archive.read(matches[0]))
          PY
      - name: Build the signed x86_64 test APK
        run: |
          set -euo pipefail
          python3 tools/prepare_mixed_flutter.py --abi x86_64
          cd flutter
          if ! flutter build apk --release --target-platform android-x64 \
              2>&1 | tee /tmp/flutter-build.log; then
            grep -iE "error|invalid|exception|failed" /tmp/flutter-build.log | tail -8 \
              | sed 's/^/::error::flutter build: /'
            exit 1
          fi
      - name: Verify the test APK
        run: |
          set -euo pipefail
          mkdir -p .local/android/releases/test
          APK=.local/android/releases/test/CRAFTIX-game-test-x86_64.apk
          cp flutter/build/app/outputs/flutter-apk/app-release.apk "$APK"
          # AGP drops the v1 (JAR) signature at minSdk >= 24; the same owner
          # key re-signs with v1+v2 exactly as the release flow does.
          bash tools/resign_craftix_apk.sh "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SIGNER="$JAVA_HOME/bin/java -jar $BT/lib/apksigner.jar"
          $SIGNER verify --verbose --print-certs "$APK" | tee .local/android/releases/test/certificate.txt
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | head -4
          echo "$BADGING" | grep -q "native-code: 'x86_64'" || { echo '::error::APK lacks x86_64 native code'; exit 1; }
          if ! python3 tools/verify_mixed_apk.py "$APK" --aapt2 "$BT/aapt2" --apksigner "$SIGNER" \
              --report .local/android/releases/test/verification.json 2>&1 | tee /tmp/verify.log; then
            grep "^ERROR:" /tmp/verify.log | tail -8 | sed 's/^/::error::verify: /'
            exit 1
          fi
          (cd .local/android/releases/test && sha256sum CRAFTIX-game-test-x86_64.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: craftix-game-test-apk
          path: .local/android/releases/test/
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/craftix-release.jks"

  game-test:
    if: ${{ inputs.game_test }}
    needs: build-test-apk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK packages
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            sudo mkdir -p /opt/android-sdk
            sudo unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
            sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
            echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/opt/android-sdk
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"
      - uses: actions/download-artifact@v4
        with:
          name: craftix-game-test-apk
          path: /tmp/test-apk
      - name: Run the game session on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python3 --version
            python3 tools/test_craftix_game_emulator.py --apk /tmp/test-apk/CRAFTIX-game-test-x86_64.apk --out craftix-game-test
      - name: Collect emulator diagnostics
        if: always()
        run: adb logcat -d > craftix-game-test/logcat-host.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craftix-game-test-results
          path: craftix-game-test/
          if-no-files-found: warn
