# Read-only verification of published APKs and the existing public key certificate.
name: CRAFTIX APK install diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous /tmp/current /tmp/diagnostics
          gh release download craftix-0.7.9-beta --pattern 'CRAFTIX-0.7.9-arm64-v8a.apk' --dir /tmp/previous
          gh release download craftix-0.8.0-beta --pattern 'CRAFTIX-0.8.0-arm64-v8a.apk' --dir /tmp/current
      - name: Compare signing key, packages and Android API signatures
        env:
          CRAFTIX_KEYSTORE_BASE64: ${{ secrets.CRAFTIX_KEYSTORE_BASE64 }}
          CRAFTIX_STORE_PASSWORD: ${{ secrets.CRAFTIX_STORE_PASSWORD }}
          CRAFTIX_KEY_ALIAS: ${{ secrets.CRAFTIX_KEY_ALIAS }}
          CRAFTIX_KEY_PASSWORD: ${{ secrets.CRAFTIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash tools/ci_craftix_signing.sh
          export CRAFTIX_KEYSTORE_FILE="$RUNNER_TEMP/craftix-release.jks"
          CERT=$("$JAVA_HOME/bin/keytool" -exportcert -keystore "$CRAFTIX_KEYSTORE_FILE" -storepass:env CRAFTIX_STORE_PASSWORD -alias "$CRAFTIX_KEY_ALIAS" | openssl x509 -inform DER -noout -fingerprint -sha256 | cut -d= -f2)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SIGNER="$JAVA_HOME/bin/java -jar $BT/lib/apksigner.jar"
          python3 tools/compare_craftix_apks.py /tmp/previous/*.apk /tmp/current/*.apk \
            --aapt2 "$BT/aapt2" --apksigner "$SIGNER" --key-fingerprint "$CERT" --report /tmp/diagnostics/comparison.json
          for apk in /tmp/previous/*.apk /tmp/current/*.apk; do
            python3 tools/diagnose_apk_install.py "$apk" --aapt2 "$BT/aapt2" --apksigner "$SIGNER" --report "/tmp/diagnostics/$(basename "$apk").json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craftix-apk-comparison
          path: /tmp/diagnostics/
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/craftix-release.jks"
  emulator-update:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous /tmp/current
          gh release download craftix-0.7.9-beta --pattern 'CRAFTIX-0.7.9-arm64-v8a.apk' --dir /tmp/previous
          gh release download craftix-0.8.0-beta --pattern 'CRAFTIX-0.8.0-arm64-v8a.apk' --dir /tmp/current
      - name: Install the old APK and update in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/test_craftix_apk_update.sh /tmp/previous/CRAFTIX-0.7.9-arm64-v8a.apk /tmp/current/CRAFTIX-0.8.0-arm64-v8a.apk
