# Diagnose a real-device "package appears to be invalid" failure using the
# PUBLISHED APK bytes. No rebuild and no signing key needed.
name: CRAFTIX APK install diagnostics
on:
  push:
    branches: [arena/92db30ff-horizon]
    paths:
      - '.github/workflows/apk-install-diagnose.yml'
      - 'tools/diagnose_apk_install.py'
      - 'ci-apk-diagnose.trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the published CRAFTIX APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          gh release download craftix-0.7.8 --pattern '*.apk' --dir /tmp/apks --clobber
          ls -lh /tmp/apks

      - name: Run deep install diagnostics
        shell: bash
        run: |
          set -o pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAVA="$JAVA_HOME/bin/java"
          {
            for apk in /tmp/apks/*.apk; do
              echo "===== $(basename "$apk") ====="
              python3 tools/diagnose_apk_install.py "$apk" \
                --aapt2 "$BT/aapt2" \
                --apksigner "$JAVA -jar $BT/lib/apksigner.jar" \
                --report "/tmp/$(basename "$apk").json" || true
              echo
            done
          } 2>&1 | tee /tmp/diagnose.txt

      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "🤖 CRAFTIX APK install diagnostics $GITHUB_RUN_ID" > /tmp/diag.md
          echo '```' >> /tmp/diag.md
          cat /tmp/diagnose.txt >> /tmp/diag.md
          echo '```' >> /tmp/diag.md
          head -c 50000 /tmp/diag.md > /tmp/diag-trim.md
          gh issue comment 1 --body-file /tmp/diag-trim.md
