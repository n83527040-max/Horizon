# Manual source checks only. This workflow does not build, sign or publish an APK.
name: CRAFTIX controls checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test touch input, editor and layout
        shell: bash
        run: |
          set -o pipefail
          trap 'printf "::error::"; tail -c 4000 /tmp/check.log | base64 -w0; echo' ERR
          cargo test -p horizon-client-render --lib touch:: -- --nocapture 2>&1 | tee /tmp/check.log
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          rustup target add aarch64-linux-android
      - name: Check Android host without packaging
        shell: bash
        run: |
          set -o pipefail
          trap 'printf "::error::"; tail -c 4000 /tmp/check.log | base64 -w0; echo' ERR
          python3 tools/android_build.py --abi arm64-v8a --check --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" 2>&1 | tee /tmp/check.log
